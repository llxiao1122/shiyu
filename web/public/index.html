<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>识阈</title><script src="./frame.js?v=2"></script><link rel="stylesheet" href="./style.css?v=27"><script defer src="./app.js?v=60"></script></head><body><header><div class="wrap header"><div class="brand"><b>学</b>学习托管</div><span>课件托管</span></div></header><main class="wrap"><section id="entry" class="hero"><section class="panel"><form id="login"><label>组织代码<input name="orgCode" value="ZGXY" required></label><label>账号<input name="username" autocomplete="username" required></label><label>官方平台密码<span class="password-row"><input type="password" name="password" autocomplete="current-password" required><button id="toggle-password" type="button" aria-label="显示密码">显示</button></span></label><button type="submit">登录</button></form><p id="status" role="status" aria-live="polite"></p></section></section><section id="workspace" hidden><div class="toolbar"><h1>考试看板</h1><button id="logout" class="secondary">退出登录</button></div><div class="panel"><p id="course-context" class="muted" hidden></p><div class="toolbar exam-toolbar"><h2 id="list-title" class="visually-hidden">待完成的考试</h2><div class="exam-tabs" role="group" aria-label="考试分类"><button id="pending-tab" class="secondary" type="button" aria-pressed="true">待完成</button><button id="history-tab" class="secondary" type="button" aria-pressed="false">已完成</button></div><button id="refresh" class="secondary" type="button">刷新</button></div><div id="exams"></div><button id="more" class="secondary" hidden>加载更多</button></div><p id="workspace-status" role="status" aria-live="polite"></p></section><dialog id="details"><div class="detail-header"><h2 id="detail-title">考试详情</h2><button id="close-details" class="secondary" type="button">关闭</button></div><div id="detail-body"></div><p id="detail-status" role="status" aria-live="polite"></p><p class="muted">确认后将自动答题并交卷，可能占用考试机会。</p></dialog></main><footer class="wrap">学习情况以实际记录为准。具体学习情况请到企业后台咨询查询。</footer></body></html>
